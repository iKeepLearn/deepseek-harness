name: Build Intel macOS DMG (Unsigned)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch or tag to build"
        required: true
        default: "master"
        type: string

permissions:
  contents: write

concurrency:
  group: build-intel-macos
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Verify Intel runner
        run: |
          echo "Architecture: $(uname -m)"
          test "$(uname -m)" = "x86_64"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11.28.5"
          
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.3"
          architecture: x64
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check packaging environment
        run: |
          pnpm run package:desktop:mac:x64:unsigned --check

      - name: Build Intel unsigned DMG
        run: |
          pnpm run package:desktop:mac:x64:unsigned

      - name: Locate DMG
        id: dmg
        run: |
          DMG_DIR="apps/desktop/.desktop-build/targets/mac-x64/unsigned-artifacts"

          DMG=$(find "$DMG_DIR" -maxdepth 1 -type f -name '*.dmg' | head -n 1)

          if [ -z "$DMG" ]; then
            echo "ERROR: DMG not found"
            echo "Contents of output directory:"
            ls -la "$DMG_DIR" || true
            exit 1
          fi

          VERSION=$(node -p "require('./package.json').version")

          echo "DMG=$DMG" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Found: $DMG"
          echo "Version: $VERSION"

      - name: Upload Intel DMG
        uses: actions/upload-artifact@v7
        with:
          name: deepseek-harness-mac-x64-unsigned-${{ steps.dmg.outputs.VERSION }}
          path: ${{ steps.dmg.outputs.DMG }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload packaging logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intel-macos-build-logs-${{ github.run_id }}
          path: apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: ignore
          retention-days: 7
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.dmg.outputs.VERSION }}-intel-${{ github.run_number }}
          name: DeepSeek Harness ${{ steps.dmg.outputs.VERSION }} Intel Mac Build #${{ github.run_number }}
          body: |
            ## DeepSeek Harness Intel macOS Build

            - Version: ${{ steps.dmg.outputs.VERSION }}
            - Architecture: Intel x86_64
            - Build: #${{ github.run_number }}
            - Source ref: ${{ inputs.source_ref }}
            - Commit: ${{ github.sha }}

            ### Important

            This is an unsigned build.
            No Apple Developer ID signing or notarization is included.

            Please remove macOS quarantine if Gatekeeper blocks the application.
          files: ${{ steps.dmg.outputs.DMG }}
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}    
